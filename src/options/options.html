<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="../popup/popup.css">
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <header class="options-header">
        <img id="options-logo" src="../icons/icon128.png" alt="">
        <div class="title-block">
            <div id="app-title"></div>
            <div id="app-subtitle" class="subtitle"></div>
        </div>
    </header>
    <div id="defaults-banner"
        style="display:none; margin-bottom:10px; padding:8px; background:#fffbe6; border:1px solid #ffe58f; border-radius:6px;">
        <strong id="defaults-banner-text"></strong>
        <button id="defaults-banner-review" class="button" style="margin-left:8px; padding:4px 8px;">Review</button>
    </div>

    <div class="columns">
        <div class="left-col">
            <h2 id="categories-title"></h2>
            <div id="session-warning" class="session-warning"></div>
            <div id="categories-container">
                <!-- Categories will be dynamically populated here -->
            </div>
        </div>

        <div class="right-col">
            <form id="options-form">
                <h2 id="behavior-title"></h2>
                <label class="row-label">
                    <input type="checkbox" id="auto-clean-on-startup">
                    <span id="auto-clean-label"></span>
                </label>
                <label class="row-label">
                    <span id="history-label"></span>
                    <input type="number" id="history-lookback-days" min="0" step="1" value="7">
                    <small id="history-inline-note" class="history-inline"></small>
                    <small id="history-note-block" class="history-block"></small>
                </label>

                <h2 id="actions-title"></h2>
                <div class="actions">
                    <button type="button" id="export-config" class="button">📤 <span id="export-label"></span></button>
                    <button type="button" id="import-config-btn" class="button">📥 <span
                            id="import-label"></span></button>
                    <input type="file" id="import-config" accept="application/json" style="display:none">
                    <button type="button" id="reset-defaults" class="button">♻️ <span id="reset-label"></span></button>
                </div>
                <!-- resize controls removed (use dev-run flags instead) -->
                <p id="warning-text" class="warning" style="display:none"></p>
                <div class="form-actions">
                    <button type="submit" class="button">💾 <span id="save-label"></span></button>
                </div>
                <div id="version-block" style="margin-top:12px; font-size:12px; color:#666">
                    <span id="version-label"></span>
                    <div><small>Data Version: <span id="data-version-label"></span></small></div>
                </div>
            </form>
        </div>
    </div>
    <script src="../shared/toast.js"></script>
    <script src="options.js"></script>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>

</html>
